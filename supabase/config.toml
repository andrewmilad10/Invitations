# Local Supabase configuration (`npx supabase start`).
# Only settings that differ from the CLI defaults are listed.
project_id = "vellum"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "15MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/confirm", "http://127.0.0.1:3000/auth/confirm"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
enable_signup = true
minimum_password_length = 8

[auth.email]
enable_signup = true
# Local only: sign in immediately after registering. Production projects should
# keep confirmations on (see docs/deployment.md).
enable_confirmations = false
double_confirm_changes = true

# Two-step login (authenticator apps). Required for staff in Admin.
[auth.mfa]
max_enrolled_factors = 10

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

# Branded auth emails (the same files are pasted into the live project:
# Supabase → Authentication → Emails → Templates). Links use the token-hash
# flow through /auth/confirm, so they work on any device.
[auth.email.template.confirmation]
subject = "Confirm your email for Vellum"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.recovery]
subject = "Choose a new Vellum password"
content_path = "./supabase/templates/recovery.html"

[auth.email.template.magic_link]
subject = "Your Vellum login link"
content_path = "./supabase/templates/magic_link.html"

[auth.email.template.email_change]
subject = "Confirm your new email for Vellum"
content_path = "./supabase/templates/email_change.html"

[auth.email.template.reauthentication]
subject = "Your Vellum security code"
content_path = "./supabase/templates/reauthentication.html"
