# The whole journey in a real browser against a real local Supabase
# (database, Auth, API, Storage) and the production build: e2e/journey.spec.ts.
name: End-to-end

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  journey:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      # Starts Postgres, Auth, the API and Storage, and applies every migration.
      - run: supabase start -x studio,imgproxy,edge-runtime,logflare,vector,supavisor,realtime
      - name: Read local keys
        id: sb
        run: |
          supabase status -o env > .sb.env
          set -a; . ./.sb.env; set +a
          echo "url=$API_URL" >> "$GITHUB_OUTPUT"
          echo "key=${PUBLISHABLE_KEY:-$ANON_KEY}" >> "$GITHUB_OUTPUT"
          echo "db=$DB_URL" >> "$GITHUB_OUTPUT"
      - name: Build the app against it
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ steps.sb.outputs.url }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ steps.sb.outputs.key }}
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
      - name: Start the app
        run: |
          npx next start -p 3000 > next.log 2>&1 &
          npx --yes wait-on@8 http://localhost:3000/api/health --timeout 60000
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ steps.sb.outputs.url }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ steps.sb.outputs.key }}
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test e2e/journey.spec.ts --project=desktop
        env:
          E2E_BASE_URL: http://localhost:3000
          E2E_SUPABASE_URL: ${{ steps.sb.outputs.url }}
          E2E_SUPABASE_KEY: ${{ steps.sb.outputs.key }}
          E2E_DB_URL: ${{ steps.sb.outputs.db }}
      - name: App log (on failure)
        if: failure()
        run: tail -200 next.log
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results
          retention-days: 7
